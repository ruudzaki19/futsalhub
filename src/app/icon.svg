<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Base Badge: Deep Navy (#0B1B3F) -->
  <rect width="64" height="64" rx="16" fill="#0B1B3F" />
  
  <!-- Outer Ring: Electric Lime (#B8F03C) -->
  <circle cx="32" cy="32" r="23" stroke="#B8F03C" stroke-width="3" fill="#0B1B3F" />
  
  <!-- Seam Lines from Pentagon to Outer Ring (White for sharp contrast) -->
  <line x1="32" y1="19" x2="32" y2="9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="43" y1="26" x2="52" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="39" y1="39" x2="48" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="39" x2="16" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="21" y1="26" x2="12" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Pentagon: Electric Lime (#B8F03C) with Deep Navy Stroke -->
  <polygon points="32,19 43,26 39,39 25,39 21,26" fill="#B8F03C" stroke="#0B1B3F" stroke-width="1.5" />
  
  <!-- Small Center Detail Accent -->
  <circle cx="32" cy="30" r="2" fill="#0B1B3F" />
</svg>
